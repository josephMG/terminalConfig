# Set the prefix to ^A.
set -g prefix C-a
bind C-a send-prefix
unbind C-b

set -g default-terminal "tmux-256color" # + "tmux -2" => 256 color
set -g base-index 1
set -g pane-base-index 1

set -s extended-keys on ##### let nvim Shift+Ctrl works
set -g mouse on
# Toggle mouse on
bind m \
    set -g mouse on \;\
    display 'Mouse: ON'

# Toggle mouse off
bind M \
    set -g mouse off \;\
    display 'Mouse: OFF'

# vi-style controls for copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe 'cat > ~/.tmux-buffer' 
# set-option -g mouse on # 自動複製滑鼠選取的文字
set-option -s set-clipboard off
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -se c -i'

# reload r
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# screen c
unbind c
bind c new-window

# detach ^D d
unbind ^D
bind ^D detach

# displays *
unbind *
bind * list-clients

# title A
unbind A
bind A command-prompt "rename-window %%"

# next ^@ ^N sp(" ") n
unbind ^@
unbind ^N
unbind " "
unbind n
# bind ^@ next-window
# bind ^N next-window
# bind " " next-window
# bind n next-window
bind -n M-x next-window

# prev ^H ^P p ^?
# bind ^H previous-window
# bind ^P previous-window
# bind p previous-window
# bind BSpace previous-window
unbind ^H
unbind ^P
unbind p
unbind BSpace
bind -n M-z previous-window

# other ^A
unbind ^A
bind ^A last-window

# windows ^w w
unbind w
bind w list-windows
unbind ^w
bind ^w choose-window

# quit 
unbind \\
bind \\ confirm-before "kill-server"

# kill K k
unbind k
bind k confirm-before "kill-window"

# open opencode in current directory in a popup
# bind C-o popup -E -d "#{pane_current_path}" -w 90% -h 90% "opencode"

bind -n ^k send-keys -R \; clear-history

# bind : to command-prompt like vim
# this is the default in tmux already
bind : command-prompt

